version: 2.1

jobs:
  verify:
    docker:
      - image: node:22
    steps:
      - checkout
      - run:
          name: Enable the pinned package manager
          command: corepack enable
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - run:
          name: Lint, typecheck, build, and test
          command: pnpm verify
      - store_artifacts:
          path: coverage

workflows:
  verification:
    jobs:
      - verify
